name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CPU build used by the smoke test; sems needs 1.24 or newer.
  ONNXRUNTIME_VERSION: "1.30.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            onnxruntime: onnxruntime-win-x64
            archive: zip
            library: lib/onnxruntime.dll
          - os: ubuntu-latest
            onnxruntime: onnxruntime-linux-x64
            archive: tgz
            library: lib/libonnxruntime.so
          - os: macos-latest
            onnxruntime: onnxruntime-osx-arm64
            archive: tgz
            library: lib/libonnxruntime.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Without ffmpeg the audio and video tests skip themselves; install it so they run.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress -y ;;
          esac

      - name: Unit and indexing tests
        run: cargo test --release --locked

      - name: Download ONNX Runtime
        shell: bash
        run: |
          name="${{ matrix.onnxruntime }}-$ONNXRUNTIME_VERSION"
          url="https://github.com/microsoft/onnxruntime/releases/download/v$ONNXRUNTIME_VERSION/$name.${{ matrix.archive }}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$url" --output "onnxruntime.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = zip ]; then unzip -q onnxruntime.zip; else tar -xzf onnxruntime.tgz; fi
          echo "SEMS_ONNXRUNTIME=$RUNNER_TEMP/$name/${{ matrix.library }}" >> "$GITHUB_ENV"

      - name: Smoke test (downloads the model, indexes and searches on the CPU)
        shell: bash
        run: tools/ci/smoke_test.sh target/release/sems
