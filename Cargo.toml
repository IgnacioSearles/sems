[package]
name = "sems"
version = "0.1.0"
edition = "2024"
description = "Semantic search for local files, powered by EmbeddingGemma 2"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7.0"
# Canonical paths without the \\?\ verbatim prefix std::fs::canonicalize adds on Windows.
dunce = "1.0"
fast_image_resize = { version = "6.1", features = ["image"] }
# ripgrep's walker: .gitignore handling and hidden-file rules users already expect.
ignore = "0.4"
image = "0.25"
# Probes the CUDA driver through the CUDA pack before choosing a runtime (already used by ort).
libloading = "0.9"
# Pure Rust, so no extra native library ships; extraction runs under catch_unwind (see documents.rs).
pdf-extract = "0.12"
# Real FFT for the audio log-mel spectrogram (see embedding/audio_features.rs).
realfft = "3.5"
# ort 2.x has not had a stable release yet; pin the exact release candidate.
# load-dynamic: onnxruntime.dll is loaded from an explicit path at runtime. Static linking needs the
# VS 2022 STL, and loading by name on Windows can pick up the outdated copy in System32.
# api-24 is the minimum ONNX Runtime API we request, not the version we run: newer runtimes still
# serve it, so CPU and CUDA run on current releases (1.30, CUDA 13, NVIDIA driver 580+). It stays at
# 24 because 1.24 is the last DirectML release, and sems uses nothing from later API versions.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24", "cuda", "directml"] }
# bundled: compiles SQLite with FTS5 and avoids depending on a system library.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Verifies downloaded model files against the hashes pinned in model_download.rs.
sha2 = "0.10"
thiserror = "2.0"
# Without default features: esaxx (tokenizer training only) links the static CRT, which clashes with ort.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# Blocking HTTPS (rustls) for the one-time model download; no async runtime needed.
ureq = "3"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
debug = "line-tables-only"
